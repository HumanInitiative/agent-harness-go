# Weekly dependency update PRs. The prefixes below make commit messages
# follow Conventional Commits ("chore(deps): Bump ..."). Dependabot always
# capitalizes "Bump", so scripts/check-commits.sh exempts Dependabot-authored
# commits from the lowercase rule only; its branch names are allowed by
# scripts/check-branch-name.sh.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
