basePath: /
definitions:
  httpapi.ChatRequest:
    properties:
      conversation_id:
        description: |-
          ConversationID continues an existing conversation. Omit it to start a
          new one; the response carries the generated ID back. 1-128 characters
          of letters, digits, '-' or '_'.
        example: 3f9c9b1e-2f0a-4a3e-9b1a-6e4b6f0c1a2b
        type: string
      message:
        description: |-
          Message is the user's message to the assistant. Required; limited to
          MAX_MESSAGE_CHARS characters.
        example: What is 12 times 7?
        type: string
    type: object
  httpapi.ChatResponse:
    properties:
      conversation_id:
        description: |-
          ConversationID identifies the conversation; send it back on the next
          request to continue.
        example: 3f9c9b1e-2f0a-4a3e-9b1a-6e4b6f0c1a2b
        type: string
      reply:
        description: Reply is the assistant's final answer.
        example: 12 times 7 is 84.
        type: string
      tool_calls:
        description: |-
          ToolCalls lists every tool the agent invoked, in order. Empty when it
          answered directly.
        items:
          $ref: '#/definitions/httpapi.ToolCallDTO'
        type: array
    type: object
  httpapi.ErrorResponse:
    properties:
      code:
        description: |-
          Code is a stable, machine-readable error identifier. Clients should
          branch on Code, never on Error.
        enum:
        - invalid_request
        - unauthorized
        - not_found
        - method_not_allowed
        - conversation_busy
        - request_too_large
        - rate_limited
        - tool_turn_limit
        - internal_error
        - model_unavailable
        - timeout
        - client_closed_request
        - program_not_found
        - document_not_found
        - no_documents
        - narrative_failed
        - no_prospects
        example: invalid_request
        type: string
      error:
        description: Error is a human-readable explanation. Its wording may change.
        example: 'invalid input: message must not be empty'
        type: string
      request_id:
        description: |-
          RequestID identifies the request in the server logs; include it when
          reporting a problem.
        example: 5b1f6c9e-7a0d-4c7e-8f5e-2d9a1c3b4e6f
        type: string
    type: object
  httpapi.OutreachCompanyDTO:
    properties:
      domain:
        type: string
      id:
        type: integer
      name:
        example: PT Contoh Energi
        type: string
      region:
        type: string
      sector:
        type: string
      verified:
        description: Verified is true only when a person confirmed the company record.
        type: boolean
    type: object
  httpapi.OutreachEmailDTO:
    properties:
      basis:
        description: Basis is the evidence the email cites.
        items:
          $ref: '#/definitions/httpapi.OutreachEvidenceDTO'
        type: array
      body:
        type: string
      subject:
        type: string
    type: object
  httpapi.OutreachEmailTraceDTO:
    properties:
      attempts:
        type: integer
      company:
        type: string
      duration_ms:
        type: integer
      input_tokens:
        type: integer
      outcome:
        type: string
      output_tokens:
        type: integer
    type: object
  httpapi.OutreachEntryDTO:
    properties:
      company:
        $ref: '#/definitions/httpapi.OutreachCompanyDTO'
      confirmed_at:
        description: ConfirmedAt is when the company's data was last confirmed current.
        example: "2026-09-01"
        type: string
      email:
        allOf:
        - $ref: '#/definitions/httpapi.OutreachEmailDTO'
        description: |-
          Email is null when none was asked for or drafting failed (Notes say
          which).
      notes:
        description: Notes are what the reviewer must check before acting on this
          entry.
        items:
          type: string
        type: array
      programs:
        items:
          $ref: '#/definitions/httpapi.OutreachProgramLineDTO'
        type: array
      proposal_channel:
        type: string
      reasons:
        items:
          type: string
        type: array
      score:
        description: Score is 0-100; Reasons say why.
        example: 82
        type: integer
      stale:
        type: boolean
    type: object
  httpapi.OutreachEvidenceDTO:
    properties:
      date:
        example: "2026-09-01"
        type: string
      date_published:
        description: |-
          DatePublished is true when Date is the publication date, false when
          it is the date the page was retrieved.
        type: boolean
      excerpt:
        type: string
      id:
        example: 11
        type: integer
      title:
        example: Program TJSL
        type: string
      url:
        example: https://contoh.co.id/csr
        type: string
    type: object
  httpapi.OutreachProgramDTO:
    properties:
      description:
        description: Description helps the model word the email; at most 3000 characters.
        example: Beasiswa untuk 120 anak di desa terpencil Jawa Barat.
        type: string
      focus_areas:
        description: |-
          FocusAreas are the fields the program works in. At least one is
          required: companies are scored on it.
        example:
        - pendidikan
        items:
          type: string
        type: array
      name:
        description: Name of the program. Required.
        example: Beasiswa Anak Desa
        type: string
      program_types:
        description: ProgramTypes are the kinds of support needed.
        example:
        - beasiswa
        items:
          type: string
        type: array
      regions:
        description: Regions where the program works. Empty means anywhere.
        example:
        - Jawa Barat
        items:
          type: string
        type: array
    type: object
  httpapi.OutreachProgramLineDTO:
    properties:
      name:
        type: string
      period_end:
        type: string
      period_start:
        type: string
      proposal_deadline:
        type: string
      status:
        type: string
    type: object
  httpapi.OutreachRequest:
    properties:
      emails:
        description: |-
          Emails asks for a draft email per company (the default). Set false
          for the shortlist alone, which costs no model call.
        example: true
        type: boolean
      format:
        description: Format is "json" (default) or "docx" (the shortlist as a Word
          file).
        enum:
        - json
        - docx
        example: json
        type: string
      limit:
        description: Limit is the number of companies, 1-25. Defaults to 10.
        example: 10
        type: integer
      program:
        $ref: '#/definitions/httpapi.OutreachProgramDTO'
    type: object
  httpapi.OutreachResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/httpapi.OutreachEntryDTO'
        type: array
      generated_at:
        example: "2026-10-22"
        type: string
      program:
        $ref: '#/definitions/httpapi.OutreachProgramDTO'
      trace:
        $ref: '#/definitions/httpapi.OutreachTraceDTO'
    type: object
  httpapi.OutreachTraceDTO:
    properties:
      duration_ms:
        type: integer
      emails:
        items:
          $ref: '#/definitions/httpapi.OutreachEmailTraceDTO'
        type: array
      estimated_cost_rupiah:
        description: EstimatedCostRupiah is present only when token prices are configured.
        type: number
      fitting:
        description: Fitting is how many companies fit the program before the cut.
        type: integer
      input_tokens:
        type: integer
      output_tokens:
        type: integer
    type: object
  httpapi.ProgramDTO:
    properties:
      id:
        description: ID is what ReportRequest.program_id takes.
        example: pangan-jakarta
        type: string
      name:
        description: Name is the program's name, for people.
        example: Bantuan Pangan Jakarta
        type: string
    type: object
  httpapi.ReportRequest:
    properties:
      documents:
        description: |-
          Documents restricts the report to these activity documents (file
          names). Omit it to use every document of the program.
        example:
        - laporan-q1.pdf
        items:
          type: string
        type: array
      format:
        description: |-
          Format is "json" (default: the draft as Markdown in the response) or
          "docx" (the draft as a Word file).
        enum:
        - json
        - docx
        example: json
        type: string
      from:
        description: |-
          From and To are the first and last day of the period, YYYY-MM-DD,
          inclusive.
        example: "2026-01-01"
        type: string
      program_id:
        description: ProgramID is the program the report is about.
        example: sample-program
        type: string
      to:
        example: "2026-03-31"
        type: string
    type: object
  httpapi.ReportResponse:
    properties:
      markdown:
        description: Markdown is the draft report.
        type: string
      notes:
        description: |-
          Notes are things the reviewer must check before the draft goes out,
          for example a number the activity documents do not contain. The same
          notes are written into the draft.
        items:
          type: string
        type: array
      sources:
        description: Sources are the activity documents the narrative sections cite.
        items:
          type: string
        type: array
    type: object
  httpapi.StatusResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  httpapi.ToolCallDTO:
    properties:
      arguments:
        description: Arguments is the JSON object the model supplied to the tool.
        type: object
      duration_ms:
        description: DurationMS is how long the tool took to run.
        example: 12
        type: integer
      error:
        description: |-
          Error is the tool's failure message when the call failed. A failed
          tool call does not fail the request: the model is told about the
          failure and decides how to proceed.
        type: string
      name:
        description: Name is the tool's identifier, e.g. "calculator".
        example: calculator
        type: string
      result:
        description: Result is the tool's output when the call succeeded.
        example: "84"
        type: string
    type: object
info:
  contact:
    name: Human Initiative Engineering
  description: AI agent harness with tool calling, built with Go and Genkit.
  title: Human Initiative Agent Harness API
  version: "1.0"
paths:
  /api/v1/chat:
    post:
      consumes:
      - application/json
      description: |-
        Sends a user message to the AI agent. The agent may call registered tools before
        replying; every call is listed in tool_calls. Pass conversation_id to continue a
        conversation, omit it to start a new one. Turns of one conversation must be sent
        one at a time.
      parameters:
      - description: Chat request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ChatResponse'
        "400":
          description: 'invalid_request: malformed body, empty or oversized message,
            bad conversation_id'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: 'unauthorized: missing or invalid X-API-Key'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "409":
          description: 'conversation_busy: another turn of this conversation is still
            running'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "413":
          description: 'request_too_large: body exceeds MAX_REQUEST_BYTES'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "429":
          description: 'rate_limited: see Retry-After header'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: internal_error or tool_turn_limit
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "503":
          description: 'model_unavailable: provider overloaded; see Retry-After header'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "504":
          description: 'timeout: the reply took longer than REQUEST_TIMEOUT_SECONDS'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Send a message to the agent
      tags:
      - agent
  /api/v1/outreach:
    post:
      consumes:
      - application/json
      description: |-
        Scores the companies in the CSR index against one Human Initiative program and returns the
        best fits with the reasons and the evidence behind them. Unless emails is false, each company
        also gets a draft approach email written by the model, which may only claim what cited
        evidence says; whatever the checks cannot confirm is listed in the entry's notes. Every draft
        needs human review. With format "docx" the response is the Word file instead of JSON.
      parameters:
      - description: Outreach request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.OutreachRequest'
      produces:
      - application/json
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      responses:
        "200":
          description: format docx
          schema:
            type: file
        "400":
          description: 'invalid_request: malformed body, missing focus area, bad limit
            or format'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: 'unauthorized: missing or invalid X-API-Key'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "413":
          description: request_too_large
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "422":
          description: 'no_prospects: no indexed company fits the program'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "429":
          description: 'rate_limited: see Retry-After header'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "503":
          description: 'model_unavailable: see Retry-After header'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "504":
          description: timeout
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Shortlist companies that may fund a program, with draft approach emails
      tags:
      - outreach
  /api/v1/programs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/httpapi.ProgramDTO'
            type: array
        "401":
          description: 'unauthorized: missing or invalid X-API-Key'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "429":
          description: 'rate_limited: see Retry-After header'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List the programs a report can be made for
      tags:
      - reports
  /api/v1/reports:
    post:
      consumes:
      - application/json
      description: |-
        Builds a draft donation report for one program and period. Figures come from the donation
        data; the narrative sections are written by the model from the program's activity
        documents and cite them. The draft always needs human review: notes lists what to check.
        With format "docx" the response is the Word file instead of JSON.
      parameters:
      - description: Report request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.ReportRequest'
      produces:
      - application/json
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      responses:
        "200":
          description: format docx
          schema:
            type: file
        "400":
          description: 'invalid_request: malformed body, bad date, unknown format'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "401":
          description: 'unauthorized: missing or invalid X-API-Key'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "404":
          description: program_not_found or document_not_found
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "413":
          description: request_too_large
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "422":
          description: 'no_documents: the program has no readable activity documents'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "429":
          description: 'rate_limited: see Retry-After header'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "502":
          description: 'narrative_failed: the model gave no usable narrative'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "503":
          description: 'model_unavailable: see Retry-After header'
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
        "504":
          description: timeout
          schema:
            $ref: '#/definitions/httpapi.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Draft a donation report
      tags:
      - reports
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.StatusResponse'
      summary: Liveness probe
      tags:
      - system
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.StatusResponse'
      summary: Readiness probe
      tags:
      - system
securityDefinitions:
  ApiKeyAuth:
    description: API key issued by the Human Initiative engineering team.
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
