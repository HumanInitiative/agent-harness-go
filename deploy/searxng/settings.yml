# Minimal SearXNG settings for agent-harness-go (WEB_SEARCH_PROVIDERS=searxng).
# Everything not set here falls back to SearXNG's defaults.
# The secret key is NOT stored here: pass it as the SEARXNG_SECRET env var.
use_default_settings: true

server:
  # The instance is only for the harness on a private network; its own
  # bot limiter would throttle the harness itself.
  limiter: false
  public_instance: false

search:
  # The harness reads results through the JSON API, which is disabled by
  # default (requests then fail with 403).
  formats: [html, json]
  default_lang: "id"
  safe_search: 1

# Every query goes to all enabled engines at once, so spreading it across
# several independent engines matters: during a real crawl of the seed list
# the default set (brave, google cse, duckduckgo) was rate-limited within
# minutes, leaving no working engine. Bing, Google and Yahoo were measured
# to work from the same host. DuckDuckGo is blocked by Indonesian ISPs, but
# works from servers elsewhere, so it stays enabled.
engines:
  - name: bing
    disabled: false
  - name: google
    disabled: false
  - name: yahoo
    disabled: false
  - name: brave
    disabled: false
  - name: duckduckgo
    disabled: false
