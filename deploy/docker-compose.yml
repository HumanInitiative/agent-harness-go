# Runs the harness together with its private SearXNG instance.
#
#   cp .env.example .env    # fill in GEMINI_API_KEY, API_KEYS, SEARXNG_SECRET
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#
# Host this on a server outside Indonesian consumer-ISP filtering (e.g. a
# cloud VM in Singapore): those filters intercept some search engines
# (DuckDuckGo is blocked outright), which would silently weaken search.
# SearXNG is reachable only from the harness, never from the internet.
#
# The CSR index is filled by csrctl, outside the harness: the csr-crawler
# service below crawls every day at 02:00 WIB. Seed companies are imported
# once (and again whenever the seed list changes); a crawl can also be
# started by hand, and waits for nothing: if the scheduled crawl is running,
# it exits with a message instead of crawling twice.
#
#   docker compose -f deploy/docker-compose.yml --env-file .env run --rm \
#     --entrypoint csrctl harness import /app/seed/companies.csv
#   docker compose -f deploy/docker-compose.yml --env-file .env run --rm \
#     --entrypoint csrctl harness crawl
name: agent-harness

services:
  harness:
    build:
      context: ..
    image: agent-harness:local
    env_file: ../.env
    environment:
      WEB_TOOLS_ENABLED: "true"
      SEARXNG_URL: http://searxng:8080
      WEB_SEARCH_PROVIDERS: searxng,duckduckgo
      CSR_TOOLS_ENABLED: "true"
    volumes:
      # The CSR index (SQLite), shared with `csrctl` runs.
      - csr-data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      searxng:
        condition: service_healthy
    restart: unless-stopped
    # Must exceed SHUTDOWN_TIMEOUT_SECONDS so in-flight requests can drain.
    stop_grace_period: 80s

  # Daily crawl of due companies into the shared index. A separate process
  # from the harness, so crawling never competes with chat requests, and
  # only one of it: the crawl lock in the database refuses a second crawl.
  csr-crawler:
    build:
      context: ..
    image: agent-harness:local
    entrypoint: ["/usr/local/bin/csrctl"]
    command: ["schedule", "-at", "02:00", "-tz", "Asia/Jakarta"]
    env_file: ../.env
    environment:
      SEARXNG_URL: http://searxng:8080
      WEB_SEARCH_PROVIDERS: searxng,duckduckgo
    volumes:
      - csr-data:/app/data
    depends_on:
      searxng:
        condition: service_healthy
    restart: unless-stopped

  searxng:
    # Pinned for reproducible behaviour; Dependabot proposes updates.
    image: searxng/searxng:2026.10.4-d48c4b555
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env (openssl rand -hex 32)}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    # No `ports:` on purpose: the instance must not be public.

volumes:
  csr-data: {}
